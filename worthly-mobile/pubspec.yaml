name: worthly_mobile
description: Worthly mobile client. Public OAuth PKCE client; never a financial-provider client.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  google_fonts: ^8.2.1
  local_auth: ^3.0.2
  flutter_web_auth_2: ^5.1.0
  url_launcher: ^6.3.2
  app_links: ^7.2.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
