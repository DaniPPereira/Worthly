spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  task:
    scheduling:
      enabled: false

worthly:
  oauth:
    generate-ephemeral-signing-key: true
    web-client-secret: test-web-client-secret
  argon2:
    memory-kb: 1024
    iterations: 1
    parallelism: 1
  enable-banking:
    application-id: test-enable-banking-app
    generate-ephemeral-key: true
    discovery-ttl: PT0S
  crypto:
    generate-ephemeral-data-key: true
