server:
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      # Trust Docker and RFC1918 hops only. Do not publish :8080 on the public internet.

management:
  server:
    port: 8081
    address: 127.0.0.1

worthly:
  oauth:
    generate-ephemeral-signing-key: false
