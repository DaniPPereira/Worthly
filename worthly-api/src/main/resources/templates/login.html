<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Worthly sign in</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #093029; font-family: system-ui, sans-serif; color: #131A19; }
        main { width: 22rem; background: #F2EFE8; border-radius: 18px; padding: 2rem; }
        h1 { font-family: Georgia, serif; font-size: 2rem; font-weight: 400; margin: 0 0 .5rem; }
        p { color: #5E6A67; font-size: .95rem; }
        label { display: block; margin-top: 1rem; font-size: .85rem; font-weight: 500; }
        input { width: 100%; padding: .65rem .7rem; border: 1px solid rgba(19,26,25,.12); border-radius: 9px; background: #fff; box-sizing: border-box; font: inherit; }
        button { margin-top: 1.25rem; width: 100%; padding: .75rem 1rem; border: none; border-radius: 9px; background: #0E4A3E; color: #F4F1EA; font-weight: 600; cursor: pointer; }
        .error { color: #A04A34; }
        .mark { display: flex; align-items: center; gap: .7rem; margin-bottom: 1.25rem; }
        .mark span { font-weight: 600; letter-spacing: -.03em; }
        .password-field { position: relative; margin-top: .35rem; }
        .password-field input { padding-right: 2.6rem; }
        .password-toggle { position: absolute; right: .2rem; top: 50%; transform: translateY(-50%); width: 2.2rem; height: 2.2rem; margin: 0; padding: 0; border: 0; background: transparent; color: #5E6A67; display: grid; place-items: center; }
    </style>
</head>
<body>
<main>
    <div class="mark">
        <svg width="28" height="28" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <rect width="48" height="48" rx="10" fill="#0E4A3E"/>
            <path d="M7 14 15 34 24 20" stroke="#F4F1EA" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M24 20 33 34 41 8" stroke="#C98F32" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Worthly</span>
    </div>
    <h1>Sign in to Worthly.</h1>
    <p>Each account keeps its own banks and investments.</p>
    <p th:if="${param.registered}">Account created. Sign in to continue.</p>
    <p class="error" th:if="${param.error}">Sign-in failed. Refresh this page and try again.</p>
    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>Email <input type="email" name="username" autocomplete="username" required/></label>
        <label>Password
            <span class="password-field">
                <input type="password" name="password" autocomplete="current-password" required/>
                <button type="button" class="password-toggle" data-password-toggle aria-label="Show password">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M2.5 12s3.5-7 9.5-7 9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                        <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.8"/>
                    </svg>
                </button>
            </span>
        </label>
        <button type="submit">Sign in</button>
    </form>
    <p><a href="/register" style="color:#0E4A3E">Create an account</a></p>
</main>
<script>
    document.querySelectorAll("[data-password-toggle]").forEach((button) => {
        button.addEventListener("click", () => {
            const input = button.parentElement.querySelector("input");
            const show = input.type === "password";
            input.type = show ? "text" : "password";
            button.setAttribute("aria-label", show ? "Hide password" : "Show password");
        });
    });
</script>
</body>
</html>
