<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Worthly authenticator</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #093029; font-family: system-ui, sans-serif; color: #131A19; }
        main { width: 22rem; background: #F2EFE8; border-radius: 18px; padding: 2rem; }
        h1 { font-family: Georgia, serif; font-size: 2rem; font-weight: 400; margin: 0 0 .5rem; }
        p { color: #5E6A67; font-size: .95rem; }
        label { display: block; margin-top: 1rem; font-size: .85rem; font-weight: 500; }
        input { width: 100%; padding: .65rem .7rem; border: 1px solid rgba(19,26,25,.12); border-radius: 9px; background: #fff; box-sizing: border-box; font: inherit; letter-spacing: .12em; }
        button { margin-top: 1.25rem; width: 100%; padding: .75rem 1rem; border: none; border-radius: 9px; background: #0E4A3E; color: #F4F1EA; font-weight: 600; cursor: pointer; }
        .error { color: #A04A34; }
        .mark { display: flex; align-items: center; gap: .7rem; margin-bottom: 1.25rem; }
        .mark span { font-weight: 600; letter-spacing: -.03em; }
        a { color: #0E4A3E; }
    </style>
</head>
<body>
<main>
    <div class="mark">
        <svg width="28" height="28" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <rect width="48" height="48" rx="10" fill="#0E4A3E"/>
            <path d="M7 14 15 34 24 20" stroke="#F4F1EA" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M24 20 33 34 41 8" stroke="#C98F32" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Worthly</span>
    </div>
    <h1>Authenticator code.</h1>
    <p>Open your authenticator app or password manager. A recovery code also works.</p>
    <p class="error" th:if="${param.error}">That code was not accepted. Try again.</p>
    <form th:action="@{/login/totp}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>Code
            <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" autocapitalize="characters" required maxlength="32" autofocus/>
        </label>
        <button type="submit">Continue</button>
    </form>
    <p><a href="/login">Back to sign in</a></p>
</main>
</body>
</html>
