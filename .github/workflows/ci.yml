name: ci

on:
  push:
    branches: [main, "phase/**", "feature/**", "fix/**"]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject committed private keys and env files
        run: |
          set -euo pipefail
          if git grep -nI -E 'BEGIN (RSA )?PRIVATE KEY|AWS_SECRET_ACCESS_KEY' -- ':!.github/**' ':!*.md' ':!agents/**'; then
            echo "Possible secret material in the tree" >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$|\.pem$'; then
            echo "Tracked .env or PEM files are not allowed" >&2
            exit 1
          fi

  prod-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL must not be published in production Compose
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("infrastructure/compose.prod.yaml").read_text(encoding="utf-8")
          chunk = text.split("  postgres:")[1].split("  api:")[0]
          if "ports:" in chunk:
              raise SystemExit("production postgres publishes host ports")
          print("production postgres is internal-only")
          PY

  api:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test worthly-api
        working-directory: worthly-api
        run: ./gradlew test --no-daemon

  web:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worthly-web/package-lock.json
      - name: Lint and test worthly-web
        working-directory: worthly-web
        run: |
          npm ci
          npm test
          npm run lint

  mobile:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze and test worthly-mobile
        working-directory: worthly-mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
